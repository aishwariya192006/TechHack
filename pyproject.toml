[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brand-shield-ai"
version = "0.1.0"
description = "BrandShield AI - Intelligent Enterprise Brand Governance and Content Verification Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Principal Distributed Systems Architect", email = "architect@brandshield.ai" }
]
keywords = [
    "brand-safety",
    "compliance",
    "verification",
    "rag",
    "pgvector",
    "fastapi",
    "sqlalchemy",
    "hexagonal-architecture"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "orjson>=3.10.0",
    "structlog>=24.1.0",
    "rich>=13.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.4.0",
    "types-passlib>=1.7.7.20240327",
    "types-python-jose>=3.3.4.20240106"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ASYNC" # flake8-async
]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
